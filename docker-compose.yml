# 三容器编排：MySQL + 后端 + 前端(nginx)。
# 密钥不写入镜像：SILICONFLOW_API_KEY 由部署时导出的环境变量注入。
services:
  db:
    image: mysql:8.0
    container_name: gdut-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在部署环境设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-gdut_campus}
      MYSQL_USER: ${DB_USER:-gdut_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在部署环境设置 DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p${DB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [campus]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gdut-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gdut_campus}
      DB_USER: ${DB_USER:-gdut_app}
      DB_PASSWORD: ${DB_PASSWORD:?请在部署环境设置 DB_PASSWORD}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?请在部署环境设置 SILICONFLOW_API_KEY}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-XingChenAGI/Xing4.0-29B}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - runtime-data:/app/.runtime
    networks: [campus]
    # 调试时可放开；生产建议只让 nginx 访问，删除下面两行。
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gdut-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [campus]
    ports:
      - "8080:80"

volumes:
  db-data:
  runtime-data:

networks:
  campus:
